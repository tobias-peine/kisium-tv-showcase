[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kisium-catalog-sync"
version = "3.0.0"
description = "Free Netzkino VOD catalog sync for Kisium TV"
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.3",
  "tenacity==9.0.0",
  "python-dotenv==1.0.1",
]

[project.scripts]
kisium-catalog-sync = "catalog_sync.__main__:main"

[tool.setuptools]
packages = ["catalog_sync"]
