name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [catalog-sync, stream-proxy]
    env:
      PYTHONPATH: ${{ github.workspace }}/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.component }}/requirements.txt
            ${{ matrix.component }}/requirements-dev.txt
      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        working-directory: ${{ matrix.component }}
        run: pytest -q

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses and install platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Generate local debug keystore
        run: ./scripts/generate-debug-keystore.sh
      - name: Build and unit-test
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :app-tv:assembleDebug :source-catalog-json:testDebugUnitTest --no-daemon
